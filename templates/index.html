<!DOCTYPE html>
<html>
<head>
    <title>Smart Classroom Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<h1>🏫 Smart Classroom System</h1>

<div class="container">

    <div class="card">
        <h2>💡 Light Status</h2>
        <p>Classroom Light: <b>ON</b></p>
    </div>

    <div class="card">
        <h2>👥 Attendance</h2>
        <p>Students Present: <b>30</b></p>
    </div>

    <div class="card">
        <h2>📄 Attendance Log</h2>
        <p>Attendance Saved Successfully</p>
    </div>

    <div class="card">
        <h2>🤖 AI Suggestion</h2>
        <p>Lights will automatically turn OFF when classroom is empty.</p>
    </div>

</div>

</body>
</html>
